name: Android

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        defaults:
            run:
                working-directory: android
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: 21

            - uses: gradle/actions/setup-gradle@v6

            # The logic against the cases in fixtures/, which the web app
            # checks too, and a debug build of the app. The runner has the
            # Android SDK.
            - run: ./gradlew :core:test :app:assembleDebug
