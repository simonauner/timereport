name: Build and deploy

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - run: npm ci
            - run: npm run lint
            - run: npm run typecheck
            - run: npm test
            - run: npx prettier --check .
            - run: npm ci --prefix sync
            - run: npm run typecheck --prefix sync

            - id: pages
              if: github.event_name != 'pull_request'
              uses: actions/configure-pages@v6

            - run: npm run build
              env:
                  PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
                  # The sync server's URL. Sync isn't offered while it's unset.
                  VITE_SYNC_URL: ${{ vars.SYNC_URL }}

            - if: github.event_name != 'pull_request'
              uses: actions/upload-pages-artifact@v5
              with:
                  path: dist

    deploy:
        if: github.event_name != 'pull_request'
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v5

    # The sync server (sync/). Deployed on every push so its config, like
    # which origins it accepts, never lags behind the app.
    deploy-sync:
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm
                  cache-dependency-path: sync/package-lock.json

            - run: npm ci --prefix sync
            - run: npm run deploy --prefix sync
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
